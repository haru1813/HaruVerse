# ─────────────────────────────────────────────────────────────
# HaruVerse 프론트 서빙 설정
#
# 개발 중에는 Vite 개발 서버가 두 가지를 해줬다.
#   ① SPA 라우팅  ② /api 를 백엔드로 프록시
# 빌드된 정적 파일에는 둘 다 없다 → 여기서 다시 만들어준다.
# ─────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # gzip — 번들이 크므로 전송량을 줄인다
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ★API 프록시★
    #   location / 보다 먼저 와야 한다. 순서가 바뀌면 /api 요청이
    #   index.html 로 넘어가 JSON 대신 HTML 이 돌아온다.
    #
    #   backend 는 compose 의 서비스 이름 — 도커 내부 DNS 가 해석한다.
    #   컨테이너끼리는 localhost 가 아니라 서비스명으로 통신한다.
    location /api/ {
        proxy_pass http://backend:8080;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 외부 API 수집(Jikan·RAWG)은 몇 분씩 걸린다.
        # 기본 60초로는 수집 요청이 게이트웨이 타임아웃으로 끊긴다.
        proxy_connect_timeout 10s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
    }

    # ★SPA 라우팅★
    #   /characters 같은 주소로 직접 들어오면 그런 파일이 없어 404 가 난다.
    #   실제 파일이 없으면 index.html 을 돌려주고, 경로 해석은 React Router 에 맡긴다.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 정적 자산은 오래 캐시 (파일명에 해시가 붙어 있어 바뀌면 이름도 바뀐다)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html 은 캐시하지 않는다 — 새 배포가 즉시 반영되어야 한다
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
