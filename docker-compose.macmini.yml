# ─────────────────────────────────────────────────────────────
# HaruVerse — 맥미니(운영) 배포용
#
# 실행:  docker compose -f docker-compose.macmini.yml up -d --build
#
# ★로컬(docker-compose.yml)과 다른 점★
#   ① MariaDB를 띄우지 않는다 — 맥미니에 이미 도는 컨테이너를 함께 쓴다
#      (blog·vocab 이 쓰는 그 인스턴스. DB만 haruverse 로 분리)
#   ② 포트가 다르다 — 맥미니에서 이미 80·200·443·3306·5200·5201 이 쓰이고 있다
#   ③ 프론트를 외부에 직접 노출하지 않는다 — 기존 nginx-server 가 앞단이다
#
# 포트 배정 (5300번대를 HaruVerse 전용으로)
#   5300  프론트 (nginx-server 가 여기로 프록시)
#   5301  백엔드
#   5302  Elasticsearch
# ─────────────────────────────────────────────────────────────

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: haruverse-elasticsearch
    ports:
      # 외부에 열 이유는 없지만, 색인 상태를 확인할 때가 있어 로컬호스트에만 연다
      - "127.0.0.1:5302:9200"
    environment:
      - discovery.type=single-node
      # ★로컬 전용★ 127.0.0.1 에만 열려 있어 외부에서 못 붙는다
      - xpack.security.enabled=false
      # ★heap 고정★ 맥미니는 다른 프로젝트와 메모리를 나눠 쓴다
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - TZ=Asia/Seoul
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      # yellow 도 정상 — 단일 노드는 복제본을 배치할 곳이 없어 green 이 안 된다
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  backend:
    build:
      context: ./haruverse_springboot
    container_name: haruverse-backend
    ports:
      - "127.0.0.1:5301:8080"
    environment:
      # ★host.docker.internal★ 맥미니에 이미 도는 MariaDB 로 나간다.
      #   컨테이너를 새로 띄우지 않으므로 서비스명으로는 못 찾는다.
      SPRING_DATASOURCE_URL: jdbc:mariadb://host.docker.internal:3306/haruverse
      SPRING_DATASOURCE_USERNAME: haruverse
      SPRING_DATASOURCE_PASSWORD: haruverse

      ELASTICSEARCH_URIS: http://elasticsearch:9200

      # 외부 API 키 — 호스트 환경변수로 주입. 없으면 그 수집만 503.
      RAWG_API_KEY: ${RAWG_API_KEY:-}
      TMDB_API_KEY: ${TMDB_API_KEY:-}

      # ★운영에서는 반드시 지정할 것★ 안 주면 개발용 기본값이 쓰인다.
      JWT_SECRET: ${JWT_SECRET:-haruverse-dev-secret-key-please-change-in-production-1234567890}

      SHOW_SQL: "false"
      TZ: Asia/Seoul
    depends_on:
      elasticsearch:
        # ★service_started★ 검색은 부가 기능이다. ES가 안 떠도 앱은 떠야 한다.
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/api/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 60s
    restart: unless-stopped

  frontend:
    build:
      context: ./haruverse_react
    container_name: haruverse-frontend
    ports:
      # 앞단이 nginx-server 이므로 로컬호스트에만 연다
      - "127.0.0.1:5300:80"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      TZ: Asia/Seoul
    restart: unless-stopped

volumes:
  es-data:
