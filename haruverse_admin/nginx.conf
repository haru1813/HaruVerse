# ─────────────────────────────────────────────────────────────
# HaruVerse 관리자 콘솔 서빙 설정
#
# ★이 파일의 존재 이유 절반은 /api 프록시다★
#   관리자 콘솔은 admin-haruverse.haru.company 라는 별도 서브도메인에 올라간다.
#   여기서 API 를 절대 URL(https://haruverse.haru.company/api/...)로 부르면
#   크로스 오리진이 되고, 백엔드에 없는 CORS 설정을 새로 만들어야 한다.
#
#   대신 앱은 경로를 "/api/..." 로만 부르고(src/lib/api.ts),
#   그 요청을 여기서 백엔드로 넘긴다. 브라우저 입장에서는 언제나 same-origin 이다.
#   허용 오리진 목록을 관리하다 실수로 여는 사고를 원천에서 없애는 구성이다.
# ─────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vuetify 번들이 크다 — 전송량을 줄인다
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 공통 보안 헤더.
    # ★add_header 를 쓰는 location 마다 다시 include 해야 한다★
    #   nginx 는 하위 블록에 add_header 가 하나라도 있으면 상위 것을 전부 버린다.
    #   실제로 여기에만 적어 두었더니, / 요청이 try_files 로 = /index.html 에
    #   재매칭되면서 그쪽 Cache-Control 하나 때문에 헤더 셋이 통째로 사라졌다.
    include /etc/nginx/security-headers.conf;

    # 크롤러가 굳이 온다면 여기서 먼저 막는다
    location = /robots.txt {
        include /etc/nginx/security-headers.conf;
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # ★API 프록시★
    #   location / 보다 먼저 와야 한다. 순서가 바뀌면 /api 요청이
    #   index.html 로 넘어가 JSON 대신 HTML 이 돌아온다.
    #
    #   backend 는 compose 의 서비스 이름 — 도커 내부 DNS 가 해석한다.
    location /api/ {
        proxy_pass http://backend:8080;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ★수집 API 는 몇 분씩 걸린다★
        #   관리자 콘솔의 주 용도가 바로 그 수집 실행이다.
        #   기본 60초로 두면 Jikan·RAWG 수집이 504 로 끊긴다.
        proxy_connect_timeout 10s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
    }

    # ★SPA 라우팅★
    #   /members 같은 주소로 직접 들어오면 그런 파일이 없어 404 가 난다.
    #   실제 파일이 없으면 index.html 을 돌려주고 경로 해석은 Vue Router 에 맡긴다.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 정적 자산은 오래 캐시 (파일명에 해시가 붙어 있어 내용이 바뀌면 이름도 바뀐다)
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html 은 캐시하지 않는다 — 새 배포가 즉시 반영되어야 한다
    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
