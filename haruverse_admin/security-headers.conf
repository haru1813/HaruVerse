# 운영 도구용 공통 응답 헤더.
#
# ★별도 파일로 뺀 이유★
#   nginx 의 add_header 는 상위 블록에서 상속되지만,
#   하위 location 에 add_header 가 '하나라도' 있으면 상위 것이 전부 무시된다.
#   server 블록에만 적어 두었더니 / 요청(try_files 로 = /index.html 에 재매칭)에서
#   Cache-Control 하나 때문에 아래 세 헤더가 통째로 사라졌다.
#   그래서 add_header 를 쓰는 location 마다 이 파일을 include 한다.

# 운영 도구는 검색엔진에 잡힐 이유가 없다.
# index.html 의 robots 메타만으로는 JS·JSON 응답까지 덮지 못한다.
add_header X-Robots-Tag "noindex, nofollow" always;

# 관리 화면이 남의 페이지 iframe 안에서 열릴 이유가 없다
add_header X-Frame-Options "DENY" always;

add_header X-Content-Type-Options "nosniff" always;
