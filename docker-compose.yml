# ─────────────────────────────────────────────────────────────
# HaruVerse — 컨테이너 구성
#
# 실행:  docker compose up -d --build
# 접속:  프론트   http://localhost:303
#        백엔드   http://localhost:304/api/works
#        MariaDB  localhost:305
#        검색     http://localhost:306   (Elasticsearch)
#
# 로컬 개발(5173 / 8080)과 포트가 겹치지 않아 동시에 띄울 수 있고,
# ★DB는 하나를 함께 쓴다★ — 로컬에서 쓴 글이 컨테이너에도 그대로 보인다.
#
# 로컬 개발만 할 때도 DB는 필요하다:
#   docker compose up -d mariadb
# ─────────────────────────────────────────────────────────────

services:
  mariadb:
    # 맥미니 운영 버전과 맞춘다 → SQL 방언 차이로 "로컬에선 됐는데"를 원천 차단
    image: mariadb:11
    container_name: haruverse-mariadb
    ports:
      # 외부 305 → 내부 3306. 로컬 백엔드와 DB 툴이 이 포트로 붙는다.
      - "305:3306"
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: haruverse
      MARIADB_USER: haruverse
      # 로컬 개발 전용이라 평문. 운영에서는 환경변수로 주입할 것.
      MARIADB_PASSWORD: haruverse
      TZ: Asia/Seoul
    command:
      # 한글이 깨지지 않도록 utf8mb4 로 고정 (기본 문자셋이 다르면 저장 시 깨진다)
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      # named volume — compose down 해도 데이터가 남는다.
      # (bind mount 로 두면 Windows 파일 권한 문제로 MariaDB 가 뜨지 않는 경우가 있다)
      - mariadb-data:/var/lib/mysql
    healthcheck:
      # ★"컨테이너가 떴다" != "접속할 수 있다"★
      #   이게 없으면 백엔드가 DB 준비 전에 붙으려다 죽는다.
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  elasticsearch:
    # Spring Boot 3.4가 관리하는 elasticsearch-java 클라이언트가 8.15 계열이라 서버도 맞춘다.
    # 메이저가 어긋나면 클라이언트가 붙는 순간이 아니라 쿼리 시점에 이상하게 실패한다.
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: haruverse-elasticsearch
    ports:
      # 외부 306 → 내부 9200. 로컬 백엔드와 색인 확인용 curl 이 이 포트로 붙는다.
      - "306:9200"
    environment:
      # 노드 하나짜리 개발용 — 클러스터 구성·투표 설정을 건너뛴다
      - discovery.type=single-node
      # ★로컬 전용★ 8.x 는 기본이 보안 켜짐(TLS+비밀번호)이라 그대로 두면
      #   http 로 접근이 안 된다. 운영에 올릴 때는 반드시 다시 켤 것.
      - xpack.security.enabled=false
      # ★heap 고정★ 안 주면 호스트 메모리의 절반을 잡으려 든다.
      #   맥미니(16GB, 다른 컨테이너와 공유)를 생각하면 반드시 제한해야 한다.
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - TZ=Asia/Seoul
    volumes:
      # named volume — compose down 해도 색인이 남는다
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      # ★yellow 도 정상으로 본다★ 단일 노드라 복제본을 배치할 곳이 없어
      #   상태가 절대 green 이 되지 않는다. green 만 기다리면 영원히 unhealthy.
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  backend:
    build:
      context: ./haruverse_springboot
    container_name: haruverse-backend
    ports:
      - "304:8080"
    environment:
      # ★컨테이너끼리는 서비스명으로 통신★ — localhost 가 아니다.
      #   application.yml 의 기본값(localhost:305)을 여기서 덮어쓴다.
      SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb:3306/haruverse
      SPRING_DATASOURCE_USERNAME: haruverse
      SPRING_DATASOURCE_PASSWORD: haruverse

      # RAWG 키는 이미지에 굽지 않고 실행 시점에 호스트 환경변수로 받는다.
      # 없으면 빈 값 → 게임 수집 API 만 503, 나머지는 정상 동작.
      # ★컨테이너끼리는 서비스명★ — localhost:306 이 아니다
      ELASTICSEARCH_URIS: http://elasticsearch:9200

      # 컨테이너 로그는 SQL 없이 — 경고가 묻히지 않게
      SHOW_SQL: "false"


      RAWG_API_KEY: ${RAWG_API_KEY:-}

      # TMDB 키 — 한국어 제목 수집용. 없으면 그 수집만 503, 나머지는 정상.
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      # ★빈 값을 넘기면 안 된다★ — Spring 입장에선 "정의된 빈 문자열"이라
      #   application.yml 의 기본값을 덮어버리고, HS256 키 길이 미달로 기동이 실패한다.
      #   그래서 여기서도 같은 개발용 기본값을 적어둔다. 운영에서는 호스트에서 지정할 것.
      JWT_SECRET: ${JWT_SECRET:-haruverse-dev-secret-key-please-change-in-production-1234567890}
      TZ: Asia/Seoul
    depends_on:
      mariadb:
        condition: service_healthy
      elasticsearch:
        # ★service_healthy 가 아니라 service_started★
        #   검색은 부가 기능이다. ES가 안 떠도 앱은 떠야 하고, DB 검색으로 동작해야 한다.
        #   healthy 를 기다리게 하면 ES 장애가 곧 전체 장애가 된다.
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/api/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 40s
    restart: unless-stopped

  frontend:
    build:
      context: ./haruverse_react
    container_name: haruverse-frontend
    ports:
      - "303:80"
    depends_on:
      backend:
        # 백엔드가 healthcheck 를 통과한 뒤에 뜬다.
        # service_started 로 두면 첫 요청이 502 로 떨어진다.
        condition: service_healthy
    environment:
      TZ: Asia/Seoul
    restart: unless-stopped

volumes:
  mariadb-data:
  es-data:
