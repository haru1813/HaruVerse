# ─────────────────────────────────────────────────────────────
# 로그인 시도 제한 (무차별 대입 방어)
#
# ★왜 nginx 인가★
#   백엔드에 시도 횟수 제한이 없다. 스프링 쪽에 붙이려면 시도 기록을 어딘가
#   저장하고(메모리? DB?) 만료를 관리해야 하는데, 관리자 콘솔 하나를 지키자고
#   그 상태를 들이는 건 과하다. nginx 는 이미 앞단에 있고 이 일을 잘한다.
#
# ★conf.d 에 따로 두는 이유★
#   limit_req_zone 은 http 블록에만 쓸 수 있다. default.conf 안에는 server
#   블록밖에 없어서 넣을 자리가 없다. conf.d/*.conf 는 http 안으로 include 되므로
#   여기서 정의하고 server 쪽에서 가져다 쓴다.
#   파일명을 00- 으로 시작해 default.conf 보다 먼저 읽히게 한다.
# ─────────────────────────────────────────────────────────────

# IP 단위로 분당 5회.
#   10m 이면 약 16만 개 IP 를 추적한다 — 개인 서비스에는 넘치게 충분하다.
#   사람이 비밀번호를 치는 속도로는 절대 안 걸리고,
#   자동화된 대입은 첫 몇 번 만에 막힌다.
limit_req_zone $binary_remote_addr zone=login_attempts:10m rate=5r/m;

# 제한에 걸렸을 때 429(Too Many Requests). 기본값은 503인데,
# 503 은 '서버 장애'로 읽혀서 원인을 헷갈리게 한다.
limit_req_status 429;

# 차단 사실을 로그에 남긴다 — 실제로 공격을 받았는지 나중에 확인할 수 있어야 한다
limit_req_log_level warn;
