# 테스트 전용 설정 — src/test/resources 가 src/main/resources 보다 우선 적용된다.
#
# 왜 분리했나 (2026-08-24)
#   개발용 설정은 H2 '파일' DB(./data/haruverse)를 쓴다. 그런데 H2 파일 DB는
#   한 번에 한 프로세스만 열 수 있어서, 개발 서버가 떠 있는 동안 테스트를 돌리면
#   "The file is locked" 로 컨텍스트 로딩이 통째로 실패한다.
#   → 테스트는 '인메모리'를 써서 개발 서버와 충돌하지 않게 하고,
#     매 실행마다 깨끗한 DB에서 시작하도록 한다(테스트 격리).

spring:
  datasource:
    # 테스트마다 독립된 인메모리 DB. MODE=MySQL 은 운영(MariaDB) 문법과 맞추기 위함
    url: jdbc:h2:mem:haruverse_test;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:

  elasticsearch:
    # 붙을 곳은 있어야 컨텍스트가 뜨므로 주소만 둔다(지연 연결이라 실제 접속은 안 한다).
    uris: http://localhost:306
    connection-timeout: 1s
    socket-timeout: 2s

  jpa:
    hibernate:
      ddl-auto: create-drop   # 테스트 시작 시 생성, 끝나면 삭제
    show-sql: false           # 테스트 로그가 SQL로 뒤덮이지 않게

  h2:
    console:
      enabled: false

# 테스트에서도 JWT 서명 키가 필요하다 (HS256 → 최소 32바이트)
jwt:
  secret: "haruverse-test-secret-key-for-junit-only-1234567890abcdef"
  expiration-ms: 3600000

# 외부 API — 테스트에서는 실제 호출하지 않지만, @Value 주입 대상이므로 키는 있어야 한다
external:
  jikan:
    base-url: https://api.jikan.moe/v4
    connect-timeout-ms: 1000
    read-timeout-ms: 2000

  # 스타레일 — 테스트는 네트워크를 타지 않지만, 빈 생성에 값이 필요하다.
  # 이 값이 없으면 @Value 해석에 실패해 ApplicationContext 자체가 뜨지 않는다.
  starrail:
    base-url: https://raw.githubusercontent.com/Mar-7th/StarRailRes/master

  # 외부 API — RAWG (게임 데이터베이스)
  # ⚠️ 무료지만 API 키 필수 (rawg.io/apidocs), 월 20,000 요청
  rawg:
    base-url: https://api.rawg.io/api
    connect-timeout-ms: 3000
    read-timeout-ms: 10000
    api-key: test-key

# ★테스트는 검색 엔진을 끈다★
#   켜두면 개발 PC에 떠 있는 '실제 색인'을 조회한다. H2의 테스트 데이터가 아니라
#   운영 데이터가 돌아와서 검색 관련 테스트가 통째로 어긋난다.
#   검색 품질은 E2E(search-es.spec.ts)에서 실제 ES로 검증한다.
search:
  elasticsearch:
    enabled: false
