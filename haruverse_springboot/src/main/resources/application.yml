spring:
  # MariaDB — 컨테이너로 띄운 인스턴스를 로컬·컨테이너 백엔드가 함께 쓴다.
  #
  # ★H2에서 갈아탄 이유★
  #   H2 파일 DB는 프로세스 하나만 열 수 있어, 로컬 개발용과 컨테이너용 DB가
  #   따로 놀았다. 로컬에서 쓴 글이 컨테이너에는 안 보여 매번 파일을 복사해야 했다.
  #   (AUTO_SERVER 로도 컨테이너 경계는 넘지 못한다)
  #
  # ⚠️ 개발할 때도 MariaDB 컨테이너가 떠 있어야 한다:
  #     docker compose up -d mariadb
  #
  # 컨테이너 안에서는 compose 가 SPRING_DATASOURCE_URL 로 덮어쓴다
  # (서비스명 mariadb:3306 — 컨테이너끼리는 localhost 가 아니다).
  datasource:
    url: jdbc:mariadb://localhost:305/haruverse
    driver-class-name: org.mariadb.jdbc.Driver
    username: haruverse
    password: haruverse

  # H2 콘솔은 제거 — 이제 MariaDB 를 쓴다.
  # DB를 직접 보려면:  docker exec -it haruverse-mariadb mariadb -u haruverse -p haruverse

  # 페이징 기본값·상한 — ?size=100000 같은 요청으로 DB를 통째로 긁어가지 못하게 막는다
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

  # JPA(Hibernate)
  elasticsearch:
    # 로컬은 306(도커 외부 포트), 컨테이너끼리는 SPRING_ELASTICSEARCH_URIS 로 덮어쓴다.
    uris: ${ELASTICSEARCH_URIS:http://localhost:306}
    # ★타임아웃을 짧게★ 검색은 부가 기능이라, ES가 죽었을 때 요청이 오래 매달리면
    #   그게 곧 서비스 장애가 된다. 빨리 실패하고 DB 검색으로 넘어가는 편이 낫다.
    connection-timeout: 3s
    socket-timeout: 10s

  jpa:
    # ★open-in-view 끄기★ (기본값 true)
    #   true면 컨트롤러·뷰 렌더링 시점까지 영속성 컨텍스트와 DB 커넥션이 유지된다.
    #   편하지만, 지연 로딩이 트랜잭션 밖에서 몰래 일어나고 커넥션을 오래 붙잡는다.
    #   끄면 "DTO 변환은 서비스(트랜잭션) 안에서" 라는 규칙이 강제된다.
    open-in-view: false
    hibernate:
      ddl-auto: update      # 엔티티 기준 테이블 자동 생성/변경 (개발용)
    # 로컬 개발에서는 쿼리를 보는 게 학습·디버깅에 도움이 되지만,
    # 컨테이너에서는 로그가 SQL로 뒤덮여 정작 필요한 경고를 못 찾는다.
    # (실제로 ES 폴백 경고 한 줄이 SQL 수백 줄에 파묻혀 진단이 늦어졌다)
    show-sql: ${SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: true

# MyBatis — 매퍼 XML 위치 + snake_case ↔ camelCase 자동 매핑
mybatis:
  mapper-locations: classpath:mappers/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

server:
  port: 8080

# JWT 설정 — 시크릿은 HS256용으로 최소 32바이트(256bit) 이상이어야 함.
# TODO(하루): 운영에선 환경변수(JWT_SECRET 등)로 주입 (소스에 하드코딩 금지)
jwt:
  # ★운영에서는 반드시 환경변수로 덮어쓸 것★ (RAWG 키와 같은 방식)
  #   아래 기본값은 로컬 개발용 자리표시자다. 공개 저장소에 올라가는 값이므로
  #   이대로 운영에 쓰면 누구나 토큰을 위조할 수 있다.
  #   HS256이라 최소 32바이트가 필요하다.
  secret: ${JWT_SECRET:haruverse-dev-secret-key-please-change-in-production-1234567890}
  expiration-ms: 3600000   # 액세스 토큰 유효기간 = 1시간

# 외부 API — Jikan (MyAnimeList 비공식 API, 무료·키 불필요)
# ⚠️ 요청 제한: 초당 3회 / 분당 60회
external:
  jikan:
    base-url: https://api.jikan.moe/v4
    connect-timeout-ms: 3000   # 연결 자체가 안 되면 3초 만에 포기
    read-timeout-ms: 10000     # 응답이 늦어도 10초까지만 기다림

  # 외부 API — 붕괴: 스타레일 캐릭터 (커뮤니티 리소스 저장소)
  # 키가 필요 없는 정적 파일이라 요청 제한이 없다.
  # ⚠️ 이미지·이름의 저작권은 호요버스에 있다 (검색·열람 목적 표시)
  starrail:
    base-url: https://raw.githubusercontent.com/Mar-7th/StarRailRes/master

  # 외부 API — TMDB (영화·TV 데이터베이스)
  # ⚠️ 무료지만 API 키 필수 (themoviedb.org/settings/api)
  # ★쓰는 이유는 딱 하나 — 한국어 제목★
  #   Jikan·RAWG 가 주는 제목이 전부 영문이라 한글로 검색이 안 된다.
  #   TMDB 는 language=ko-KR 로 현지화 제목을 준다.
  tmdb:
    base-url: https://api.themoviedb.org/3
    connect-timeout-ms: 3000
    read-timeout-ms: 10000
    # ★키는 소스에 두지 않는다★ — 환경변수 TMDB_API_KEY 로 주입 (없으면 빈 값)
    api-key: ${TMDB_API_KEY:}

  # 외부 API — RAWG (게임 데이터베이스)
  # ⚠️ 무료지만 API 키 필수 (rawg.io/apidocs), 월 20,000 요청
  rawg:
    base-url: https://api.rawg.io/api
    connect-timeout-ms: 3000
    read-timeout-ms: 10000
    # ★키는 소스에 두지 않는다★ — 환경변수 RAWG_API_KEY로 주입 (없으면 빈 값)
    api-key: ${RAWG_API_KEY:}
